# Builds Ztrack for the Asciiverse catalog: one archive per target, named
# <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus a SHA256SUMS
# file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Runs on a pushed tag, or by hand for an
# existing tag.
#
# Linux builds run in Alpine and link ncurses statically, so the binaries
# carry the -musl triple that av looks for first. macOS links the system
# ncurses. Windows is cross-compiled with MinGW against PDCurses' Windows
# console port, linked statically, hence the -gnu triple. Ztrack needs
# nothing but curses, so the same ztrack.c builds everywhere.

name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: ztrack
  BIN: ztrack
  TAG: ${{ inputs.tag || github.ref_name }}
  PDCURSES_VERSION: "3.9"

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static &&
            make CFLAGS="-O2 -Wall -DHAVE_RANDOM" LIBS="-static -s -lncurses"'
          file "$BIN"

      - name: Package
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp "$BIN" README stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          make CC=cc CFLAGS="-O2 -Wall -DHAVE_RANDOM -arch ${{ matrix.arch }}" LIBS="-arch ${{ matrix.arch }} -lncurses"
          strip "$BIN"
          file "$BIN"

      - name: Package
        run: |
          mkdir -p stage dist
          cp "$BIN" README stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
      CROSS: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build PDCurses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          curl -sL "https://github.com/wmcbrine/PDCurses/archive/refs/tags/$PDCURSES_VERSION.tar.gz" | tar xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION/wincon" CC=$CROSS-gcc AR=$CROSS-ar pdcurses.a

      - name: Build
        run: |
          # no -DHAVE_RANDOM: MinGW has no random(), so rand() is used
          pdc="$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION"
          $CROSS-gcc -O2 -Wall -I"$pdc" ztrack.c "$pdc/wincon/pdcurses.a" -static -s -o "$BIN.exe"
          file "$BIN.exe"

      - name: Package
        run: |
          mkdir -p stage dist
          cp "$BIN.exe" README stage/
          (cd stage && zip -r "../dist/$ID-$TARGET.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Ztrack $TAG" \
                 --notes "Ztrack $TAG, Russell Marks' 1995 public-domain curses driving game, built for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
